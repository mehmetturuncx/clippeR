    <header>

            <button class="header-btn" id="clear-all-btn" title="Clear All">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>

            <div id="clear-confirm-popup" class="hidden">
                <div class="confirm-text">Clear all?</div>
                <div class="confirm-actions">
                    <button id="confirm-yes">Yes</button>
                    <button id="confirm-no">No</button>
                </div>
            </div>
        </div>
    </header>
    <div id="settings-panel" class="hidden">
        <div class="settings-header">
            <span>Settings</span>
            <button id="settings-close" class="settings-close-btn" title="Close">

                <div class="setting-label">
                    <span>History Limit</span>
                    <span class="setting-value" id="limit-value">100</span>
                </div>
                <input type="range" id="history-limit" min="50" max="500" step="50" value="100">
                <div class="setting-range-labels">
                    <span>50</span>
                    <span>500</span>
                </div>
            </div>
        </div>
    </div>
    <div id="history-list"></div>
